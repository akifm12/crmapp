workflows:
  android-release:
    name: Android Release (Play Store)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        # Create an "android_signing" group in Codemagic → Teams → Environment
        # variables with these three vars:
        #   CM_KEYSTORE            — base64 of your .jks keystore file
        #   CM_KEYSTORE_PASSWORD   — keystore password
        #   CM_KEY_ALIAS           — key alias
        #   CM_KEY_PASSWORD        — key password
        - android_signing
      vars:
        PACKAGE_NAME: "ae.bluearrow.app"
    scripts:
      - name: Set up release keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > $CM_BUILD_DIR/android/app/keystore.jks
          cat <<EOF > $CM_BUILD_DIR/android/key.properties
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=keystore.jks
          EOF
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build release AAB
        script: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=https://bluearrow.ae/api/v1
      - name: Build release APK (for direct install/testing)
        script: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://bluearrow.ae/api/v1
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk
      - build/app/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - akifmush@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment once you've connected a Google Play service account in
      # Codemagic → Teams → Integrations → Google Play, then set the track
      # you want (internal/alpha/beta/production):
      # google_play:
      #   credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true

  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        # Connect your Apple Developer account in Codemagic → Teams →
        # Integrations → Apple Developer Portal, then reference it here.
        distribution_type: app_store
        bundle_identifier: ae.bluearrow.app
      vars:
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build release IPA
        script: |
          flutter build ipa --release \
            --dart-define=API_BASE_URL=https://bluearrow.ae/api/v1 \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - akifmush@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment once your App Store Connect integration is set up in
      # Codemagic → Teams → Integrations → App Store Connect:
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      #   submit_to_app_store: false
