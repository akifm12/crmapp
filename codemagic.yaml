workflows:
  android-release:
    name: Android Release (Play Store)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        # Create an "android_signing" group under this app's Environment
        # variables in Codemagic with these four vars (this is the ORIGINAL
        # keystore the live Play Store app was signed with, not a new one):
        #   CM_KEYSTORE            — base64 of your .jks keystore file
        #   CM_KEYSTORE_PASSWORD   — keystore password
        #   CM_KEY_ALIAS           — key alias
        #   CM_KEY_PASSWORD        — key password
        - android_signing
      vars:
        PACKAGE_NAME: "ae.bluearrow.bamc"
    scripts:
      - name: Set up release keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > $CM_BUILD_DIR/android/app/keystore.jks
          cat <<EOF > $CM_BUILD_DIR/android/key.properties
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=keystore.jks
          EOF
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build release AAB
        script: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=https://bluearrow.ae/api/v1
      - name: Build release APK (for direct install/testing)
        script: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://bluearrow.ae/api/v1
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk
      - build/app/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - akifmush@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment once you've connected a Google Play service account under
      # this app's Integrations → Google Play, then set the track you want
      # (internal/alpha/beta/production):
      # google_play:
      #   credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true

  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: BAMC-APP
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        # ios_signing group holds IOS_CERT_P12_PASSWORD (chosen by you) and,
        # after the one-time export step below, CM_IOS_CERTIFICATE_P12
        # (base64 of the persisted cert+key — reused on every future build
        # instead of creating a new Apple Distribution certificate each time,
        # which Apple's account-level limit won't allow).
        - ios_signing
      vars:
        BUNDLE_ID: "ae.bluearrow.bamc"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up keychain
        script: keychain initialize
      - name: Import persisted certificate (if already saved)
        script: |
          if [ -n "$CM_IOS_CERTIFICATE_P12" ]; then
            echo "$CM_IOS_CERTIFICATE_P12" | base64 --decode > $CM_BUILD_DIR/ios_distribution.p12
            keychain add-certificates \
              --certificate $CM_BUILD_DIR/ios_distribution.p12 \
              --certificate-password "$IOS_CERT_P12_PASSWORD"
            # fetch-signing-files tracks certificates by private key, separately from
            # the system keychain — extract the key so it recognizes this cert as ours
            # instead of trying to save a fresh copy of it (and failing). Pipe through
            # `openssl rsa` to strip the "Bag Attributes" header pkcs12 prints, which
            # fetch-signing-files rejects as an invalid key file.
            openssl pkcs12 -in $CM_BUILD_DIR/ios_distribution.p12 \
              -nocerts -nodes \
              -passin "pass:$IOS_CERT_P12_PASSWORD" \
              | openssl rsa -out $CM_BUILD_DIR/ios_distribution.key
          fi
      - name: Fetch/create signing files
        script: |
          if [ -z "$CM_IOS_CERTIFICATE_P12" ]; then
            # First-ever run: generate a new key and create the certificate.
            openssl genrsa -out $CM_BUILD_DIR/ios_distribution.key 2048
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --certificate-key "@file:$CM_BUILD_DIR/ios_distribution.key" \
              --p12-password "$IOS_CERT_P12_PASSWORD" \
              --create
            # fetch-signing-files already saves the cert+key as a .p12 — just grab it.
            CERT_P12=$(ls -t "/Users/builder/Library/Developer/Xcode/UserData/Certificates"/*.p12 | head -1)
            cp "$CERT_P12" $CM_BUILD_DIR/ios_distribution_export.p12
            echo "Certificate exported to artifacts as ios_distribution_export.p12 — download it, base64-encode it, and save it as CM_IOS_CERTIFICATE_P12 so future builds reuse it instead of creating a new one."
            # Import it into THIS build's keychain too, so exportArchive can find it now.
            keychain add-certificates \
              --certificate $CM_BUILD_DIR/ios_distribution_export.p12 \
              --certificate-password "$IOS_CERT_P12_PASSWORD"
          else
            # Certificate already persisted and imported above — pass the same key so
            # the tool matches it against the existing certificate instead of trying
            # to save a new one.
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --certificate-key "@file:$CM_BUILD_DIR/ios_distribution.key" \
              --p12-password "$IOS_CERT_P12_PASSWORD" \
              --create
          fi
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build release IPA
        script: |
          flutter build ipa --release \
            --dart-define=API_BASE_URL=https://bluearrow.ae/api/v1 \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - ios_distribution_export.p12
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - akifmush@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
