workflows:
  android-release:
    name: Android Release (Play Store)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        # Create an "android_signing" group under this app's Environment
        # variables in Codemagic with these four vars (this is the ORIGINAL
        # keystore the live Play Store app was signed with, not a new one):
        #   CM_KEYSTORE            — base64 of your .jks keystore file
        #   CM_KEYSTORE_PASSWORD   — keystore password
        #   CM_KEY_ALIAS           — key alias
        #   CM_KEY_PASSWORD        — key password
        - android_signing
      vars:
        PACKAGE_NAME: "ae.bluearrow.bamc"
    scripts:
      - name: Set up release keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > $CM_BUILD_DIR/android/app/keystore.jks
          cat <<EOF > $CM_BUILD_DIR/android/key.properties
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=keystore.jks
          EOF
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build release AAB
        script: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=https://bluearrow.ae/api/v1
      - name: Build release APK (for direct install/testing)
        script: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://bluearrow.ae/api/v1
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk
      - build/app/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - akifmush@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment once you've connected a Google Play service account under
      # this app's Integrations → Google Play, then set the track you want
      # (internal/alpha/beta/production):
      # google_play:
      #   credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true

  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Signing is handled entirely by the explicit script steps below
      # (keychain initialize / app-store-connect fetch-signing-files /
      # xcode-project use-profiles) — no declarative ios_signing block
      # here, since running both at once conflicts with each other.
      vars:
        BUNDLE_ID: "ae.bluearrow.bamc"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build release IPA
        script: |
          flutter build ipa --release \
            --dart-define=API_BASE_URL=https://bluearrow.ae/api/v1 \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - akifmush@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment once your App Store Connect integration is set up under
      # this app's Integrations → App Store Connect:
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      #   submit_to_app_store: false
